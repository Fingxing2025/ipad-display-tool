name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Python GI
        run: sudo apt-get update && sudo apt-get install -y python3-gi
      - name: Run regression tests
        run: PYTHONPATH=src /usr/bin/python3 -m unittest discover -s tests -v
      - name: Check Python syntax
        run: /usr/bin/python3 -m compileall -q src install.py
